<!doctype html>
<html lang="{{ lang }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tweakers Monitor{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* ── Theme variables ──────────────────────────────────────────────────── */
    :root {
      --tw-orange:      #e8770e;
      --tw-orange-dark: #c45f00;
    }

    [data-theme="light"] {
      --bg-body:        #f4f5f7;
      --bg-card:        #ffffff;
      --bg-card-hover:  #f8f9fa;
      --bg-table-head:  #f8f9fa;
      --bg-tip:         #f8f9fa;
      --text-main:      #212529;
      --text-muted:     #6c757d;
      --text-heading:   #212529;
      --border-color:   #dee2e6;
      --shadow-sm:      0 2px 8px rgba(0,0,0,.08);
      --shadow-md:      0 6px 18px rgba(0,0,0,.12);
      --thumb-bg:       linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
      --thumb-color:    #adb5bd;
      --input-bg:       #fff;
      --input-color:    #212529;
      --input-border:   #ced4da;
      --bs-body-bg:     #f4f5f7;
      --bs-body-color:  #212529;
    }

    [data-theme="dark"] {
      --bg-body:        #111318;
      --bg-card:        #1c1e26;
      --bg-card-hover:  #22252f;
      --bg-table-head:  #16181f;
      --bg-tip:         #16181f;
      --text-main:      #f0f2f8;
      --text-muted:     #a8adc4;
      --text-heading:   #ffffff;
      --border-color:   #2e3140;
      --shadow-sm:      0 2px 8px rgba(0,0,0,.35);
      --shadow-md:      0 6px 18px rgba(0,0,0,.45);
      --thumb-bg:       linear-gradient(135deg, #22252f 0%, #1c1e26 100%);
      --thumb-color:    #5a5f78;
      --input-bg:       #22252f;
      --input-color:    #f0f2f8;
      --input-border:   #2e3140;
      --bs-body-bg:     #111318;
      --bs-body-color:  #f0f2f8;
    }

    /* ── Base ─────────────────────────────────────────────────────────────── */
    body {
      background: var(--bg-body);
      color: var(--text-main);
      font-family: 'Segoe UI', sans-serif;
      transition: background .2s, color .2s;
    }

    /* ── Navbar ───────────────────────────────────────────────────────────── */
    .navbar {
      background: linear-gradient(135deg, #0f0a05 0%, #1a1008 100%) !important;
      border-bottom: 1px solid rgba(232,119,14,.18);
      position: relative;
      padding-top: 10px !important;
      padding-bottom: 10px !important;
    }

    .navbar::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #e8770e 0%, #ffaa55 50%, #e8770e 100%);
      z-index: 10;
    }

    .navbar::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(232,119,14,.12) 1px, transparent 1px);
      background-size: 22px 22px;
      pointer-events: none;
      z-index: 0;
    }

    .navbar > .container {
      position: relative;
      z-index: 1;
    }

    .navbar-brand {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -.3px;
      color: #fff !important;
    }

    .navbar-brand .brand-icon {
      color: #ffaa55;
      filter: drop-shadow(0 0 6px rgba(255,170,85,.6));
    }

    .navbar .nav-link { color: rgba(255,255,255,.75) !important; transition: color .15s; }
    .navbar .nav-link:hover,
    .navbar .nav-link.active { color: #fff !important; }
    .navbar .nav-link.active {
      background: rgba(232,119,14,.25);
      border-radius: 8px;
    }

    #theme-toggle {
      background: rgba(232,119,14,.2);
      border: 1px solid rgba(232,119,14,.35);
      border-radius: 20px;
      color: #ffcc88;
      padding: 4px 12px;
      font-size: .82rem;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      white-space: nowrap;
    }
    #theme-toggle:hover {
      background: rgba(232,119,14,.38);
      border-color: rgba(255,170,85,.6);
      color: #fff;
    }

    /* ── Cards ────────────────────────────────────────────────────────────── */
    .card {
      background: var(--bg-card) !important;
      border-color: var(--border-color) !important;
      color: var(--text-main) !important;
    }
    .stat-card { border: none !important; border-radius: 12px; box-shadow: var(--shadow-sm); }
    .stat-card .stat-icon { font-size: 2rem; opacity: .7; }
    .stat-card .stat-value { font-size: 2rem; font-weight: 700; }

    .item-card {
      border: none !important;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      transition: transform .15s, box-shadow .15s;
      overflow: hidden;
    }
    .item-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .item-card .item-thumb { width: 100%; height: 160px; object-fit: cover; }
    .item-card .item-thumb-placeholder {
      height: 160px;
      background: var(--thumb-bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--thumb-color); font-size: 2.5rem;
    }
    .item-price { font-size: 1.1rem; font-weight: 700; color: var(--tw-orange); }
    .badge-search { background: var(--tw-orange); font-size: .7rem; }
    .badge-reserved { background: #dc3545; font-size: .65rem; }

    /* ── Log box ──────────────────────────────────────────────────────────── */
    .log-box {
      background: #0d0f14;
      color: #cdd6f4;
      border-radius: 10px;
      font-family: 'Courier New', monospace;
      font-size: .8rem;
      height: 240px;
      overflow-y: auto;
      padding: 12px 16px;
    }
    .log-INFO    { color: #a6e3a1; }
    .log-ERROR   { color: #f38ba8; }
    .log-WARNING { color: #fab387; }
    .log-DEBUG   { color: #89b4fa; }

    /* ── Table ────────────────────────────────────────────────────────────── */
    .table { color: var(--text-main) !important; border-color: var(--border-color) !important; }
    .table thead th {
      font-size: .8rem; text-transform: uppercase;
      letter-spacing: .05em; color: var(--text-muted);
      background: var(--bg-table-head);
      border-color: var(--border-color) !important;
    }
    .table tbody tr { border-color: var(--border-color) !important; }
    .table-hover tbody tr:hover { background: var(--bg-card-hover) !important; }

    /* ── Form controls ────────────────────────────────────────────────────── */
    .form-control, .form-select {
      background: var(--input-bg) !important;
      color: var(--input-color) !important;
      border-color: var(--input-border) !important;
    }
    .form-control::placeholder { color: var(--text-muted) !important; }
    .form-control:focus, .form-select:focus {
      background: var(--input-bg) !important;
      color: var(--input-color) !important;
      border-color: var(--tw-orange) !important;
      box-shadow: 0 0 0 .2rem rgba(232,119,14,.2) !important;
    }
    .input-group-text {
      background: var(--bg-table-head) !important;
      color: var(--text-main) !important;
      border-color: var(--input-border) !important;
    }

    /* ── Modal ────────────────────────────────────────────────────────────── */
    .modal-content {
      background: var(--bg-card) !important;
      color: var(--text-main) !important;
      border-color: var(--border-color) !important;
    }

    /* ── Misc ─────────────────────────────────────────────────────────────── */
    .bg-light { background: var(--bg-tip) !important; }
    .text-muted { color: var(--text-muted) !important; }
    h1,h2,h3,h4,h5,h6 { color: var(--text-heading); }
    hr { border-color: var(--border-color); }
    code { color: var(--tw-orange); background: transparent; }

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    .btn-tw  { background: var(--tw-orange); border-color: var(--tw-orange); color: #fff; }
    .btn-tw:hover { background: var(--tw-orange-dark); border-color: var(--tw-orange-dark); color: #fff; }
    .btn-outline-secondary {
      color: var(--text-muted) !important;
      border-color: var(--border-color) !important;
    }
    .btn-outline-secondary:hover {
      background: var(--bg-card-hover) !important;
      color: var(--text-main) !important;
    }

    /* ── Dark mode Bootstrap overrides ───────────────────────────────────── */
    [data-theme="dark"] .text-dark   { color: var(--text-main) !important; }
    [data-theme="dark"] .text-body   { color: var(--text-main) !important; }
    [data-theme="dark"] .text-muted  { color: var(--text-muted) !important; }
    [data-theme="dark"] .fw-medium,
    [data-theme="dark"] .fw-semibold,
    [data-theme="dark"] .fw-bold     { color: inherit; }
    [data-theme="dark"] .form-label  { color: var(--text-main) !important; }
    [data-theme="dark"] .form-text   { color: var(--text-muted) !important; }
    [data-theme="dark"] label        { color: var(--text-main) !important; }
    [data-theme="dark"] .table-light { background: var(--bg-table-head) !important; color: var(--text-muted) !important; }
    [data-theme="dark"] .table       { --bs-table-color: var(--text-main); --bs-table-bg: transparent; --bs-table-border-color: var(--border-color); }
    [data-theme="dark"] .table-hover { --bs-table-hover-bg: var(--bg-card-hover); --bs-table-hover-color: var(--text-main); }
    [data-theme="dark"] .card        { --bs-card-color: var(--text-main); }
    [data-theme="dark"] .card-body   { color: var(--text-main) !important; }
    [data-theme="dark"] .modal-header .btn-close { filter: invert(1) grayscale(1); }
    [data-theme="dark"] ol, [data-theme="dark"] li { color: var(--text-muted); }
    [data-theme="dark"] .alert-info    { background: #1a2535; border-color: #1f3a5f; color: #89b4fa; }
    [data-theme="dark"] .alert-success { background: #251a0a; border-color: #4a2d05; color: #ffaa55; }
    [data-theme="dark"] .alert-danger  { background: #2a1520; border-color: #4a1f2f; color: #f38ba8; }
  </style>
  <script>
    (function() {
      var t = localStorage.getItem('tw-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="/">
      <i class="bi bi-search-heart me-2 brand-icon"></i>Tweakers Monitor
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">
            <i class="bi bi-house me-1"></i>{{ t.nav_dashboard }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'searches' %}active{% endif %}" href="/searches">
            <i class="bi bi-search me-1"></i>{{ t.nav_searches }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}" href="/settings">
            <i class="bi bi-gear me-1"></i>{{ t.nav_settings }}
          </a>
        </li>
        <li class="nav-item ms-lg-2">
          <button id="theme-toggle" title="Toggle theme">
            <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
            <span id="theme-label" class="ms-1">{{ t.nav_dark }}</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function () {
    var html  = document.documentElement;
    var btn   = document.getElementById('theme-toggle');
    var icon  = document.getElementById('theme-icon');
    var label = document.getElementById('theme-label');
    var labelDark  = {{ t.nav_dark  | tojson }};
    var labelLight = {{ t.nav_light | tojson }};

    function applyTheme(theme) {
      html.setAttribute('data-theme', theme);
      localStorage.setItem('tw-theme', theme);
      if (theme === 'dark') {
        icon.className = 'bi bi-sun-fill';
        label.textContent = labelLight;
      } else {
        icon.className = 'bi bi-moon-stars-fill';
        label.textContent = labelDark;
      }
    }

    applyTheme(localStorage.getItem('tw-theme') || 'light');

    btn.addEventListener('click', function () {
      applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
